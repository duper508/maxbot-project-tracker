services:
  buzz-kanban:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: buzz-kanban
    restart: unless-stopped
    ports:
      - "127.0.0.1:8380:3000"
    env_file:
      - .env
    volumes:
      - kanban-data:/app/server/data
    networks:
      - kanban
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  kanban-data:

networks:
  kanban:
    ipam:
      config:
        - subnet: 172.28.0.0/16
