services:
  buzz-kanban:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: buzz-kanban
    restart: unless-stopped
    ports:
      - "127.0.0.1:8380:3000"
    env_file:
      - .env
    volumes:
      - kanban-data:/app/server/data
    networks:
      - kanban
    healthcheck:
      # 127.0.0.1, not localhost. The image resolves localhost to ::1 first and the server
      # binds IPv4 only (HOST=0.0.0.0), so a localhost probe is refused forever and the
      # container reports unhealthy while serving normally.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  kanban-data:

networks:
  kanban:
    ipam:
      config:
        - subnet: 172.28.0.0/16
