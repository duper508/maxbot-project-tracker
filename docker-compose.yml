services:
  buzz-kanban:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: buzz-kanban
    restart: unless-stopped
    ports:
      - "8380:3000"
    env_file:
      - .env
    volumes:
      - kanban-data:/app/server/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  kanban-data:
